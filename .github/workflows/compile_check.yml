name: Code Syntax & Compilation Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  compile-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Run Python compilation check
      run: |
        echo "Running AST syntax validation on all Python files..."
        python -m compileall -q -x "venv|\.venv|\.git|scratch" .
        echo "All Python files successfully verified!"

    - name: Run JavaScript template syntax check
      run: |
        echo "Running syntax validation on JavaScript template files..."
        for f in templates/*.js; do
          if [ -f "$f" ]; then
            echo "Checking $f..."
            node -e "const fs = require('fs'); const code = fs.readFileSync('$f', 'utf8').replace(/\{\{.*?\}\}/g, '1'); require('vm').runInNewContext(code);"
            echo "  -> $f syntax OK"
          fi
        done
        echo "All JavaScript templates successfully verified!"
