name: Code Syntax & Compilation Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  compile-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Run Python compilation check
      run: |
        echo "Running AST syntax validation on all Python files..."
        python -m compileall -q -x "venv|\.venv|\.git|scratch" .
        echo "All Python files successfully verified!"

    - name: Run JavaScript & HTML Template syntax check
      run: |
        echo "Running syntax validation on JavaScript & HTML template files..."

        # 1. Check standalone JS files (compile check)
        for f in templates/*.js; do
          if [ -f "$f" ]; then
            echo "Checking JS file: $f..."
            node -e "const fs = require('fs'); const code = fs.readFileSync('$f', 'utf8').replace(/\{\{.*?\}\}/g, '1'); new (require('vm').Script)(code);"
            echo "  -> $f syntax OK"
          fi
        done

        # 2. Check HTML files with inline JS script blocks (compile check)
        for f in templates/*.html; do
          if [ -f "$f" ]; then
            echo "Checking HTML file: $f..."
            node -e "
              const fs = require('fs');
              const code = fs.readFileSync('$f', 'utf8');
              const scriptRegex = /<script>([\s\S]*?)<\/script>/g;
              let match;
              let idx = 0;
              let errors = 0;
              while ((match = scriptRegex.exec(code)) !== null) {
                  idx++;
                  const jsCode = match[1].replace(/\{\{.*?\}\}/g, '1');
                  try {
                      new (require('vm').Script)(jsCode);
                      console.log('  -> Inline script block #' + idx + ' syntax OK');
                  } catch (e) {
                      console.error('  -> Inline script block #' + idx + ' compilation error:', e.message);
                      errors++;
                  }
              }
              if (errors > 0) process.exit(1);
            "
            echo "  -> $f syntax OK"
          fi
        done
        echo "All JavaScript and HTML templates successfully verified!"

    - name: Run ShellCheck on shell scripts
      run: |
        echo "Running static analysis on shell scripts..."
        for f in *.sh; do
          if [ -f "$f" ]; then
            echo "Checking shell script: $f..."
            shellcheck -s bash "$f"
          fi
        done
        echo "All shell scripts successfully verified!"
