# dvc.yaml
stages:
  deduplicate:
    cmd: >-
      python process_scraped_data.py
      --dirs ${pipeline.input_dirs}
      --save_path ${pipeline.output_dir}
      --output_name ${pipeline.base_name}_deduplicated
      --limit_cells ${pipeline.limit_cells}
      --checkpoint_interval ${pipeline.checkpoint_interval}
      --tips_batch_size ${pipeline.batch_size}
    deps:
      - process_scraped_data.py
    params:
      - pipeline.input_dirs
      - pipeline.output_dir
      - pipeline.base_name
      - pipeline.limit_cells
      - pipeline.checkpoint_interval
      - pipeline.batch_size
    outs:
      - ${pipeline.output_dir}/${pipeline.base_name}_deduplicated.parquet

  cluster:
    cmd: >-
      python cluster_images_global.py
      --pkl ${pipeline.output_dir}/${pipeline.base_name}_deduplicated.parquet
      --k ${pipeline.k_clusters}
      --out ${pipeline.output_dir}/${pipeline.base_name}_clustered_k_${pipeline.k_clusters}.parquet
      --minibatch
      --label_method ${pipeline.label_method}
      --mllm_backend ${pipeline.mllm_backend}
      --mllm_model ${pipeline.mllm_model}
      --chunk_size ${pipeline.chunk_size}
      --gpu
    deps:
      - cluster_images_global.py
      - ${pipeline.output_dir}/${pipeline.base_name}_deduplicated.parquet
    params:
      - pipeline.output_dir
      - pipeline.base_name
      - pipeline.k_clusters
      - pipeline.label_method
      - pipeline.mllm_backend
      - pipeline.mllm_model
      - pipeline.chunk_size
    outs:
      - ${pipeline.output_dir}/${pipeline.base_name}_clustered_k_${pipeline.k_clusters}.parquet

  visualize_map:
    cmd: >-
      python visualize_clusters.py
      --pkl_file ${pipeline.output_dir}/${pipeline.base_name}_clustered_k_${pipeline.k_clusters}.parquet
      --output ${pipeline.output_dir}/global_cluster_map.html
      --max_markers ${pipeline.max_markers}
    deps:
      - visualize_clusters.py
      - ${pipeline.output_dir}/${pipeline.base_name}_clustered_k_${pipeline.k_clusters}.parquet
    params:
      - pipeline.output_dir
      - pipeline.base_name
      - pipeline.k_clusters
      - pipeline.max_markers
    outs:
      - ${pipeline.output_dir}/global_cluster_map.html

  visualize_samples:
    cmd: >-
      python visualize_cluster_samples.py
      --pkl ${pipeline.output_dir}/${pipeline.base_name}_clustered_k_${pipeline.k_clusters}.parquet
      --out ${pipeline.output_dir}/cluster_samples_k_${pipeline.k_clusters}.html
      --top_n 6
    deps:
      - visualize_cluster_samples.py
      - ${pipeline.output_dir}/${pipeline.base_name}_clustered_k_${pipeline.k_clusters}.parquet
    params:
      - pipeline.output_dir
      - pipeline.base_name
      - pipeline.k_clusters
    outs:
      - ${pipeline.output_dir}/cluster_samples_k_${pipeline.k_clusters}.html

  visualize_scatter:
    cmd: >-
      python visualize_cluster_scatter.py
      --pkl ${pipeline.output_dir}/${pipeline.base_name}_clustered_k_${pipeline.k_clusters}.parquet
      --out ${pipeline.output_dir}/cluster_semantic_scatter_k_${pipeline.k_clusters}.png
    deps:
      - visualize_cluster_scatter.py
      - ${pipeline.output_dir}/${pipeline.base_name}_clustered_k_${pipeline.k_clusters}.parquet
    params:
      - pipeline.output_dir
      - pipeline.base_name
      - pipeline.k_clusters
    outs:
      - ${pipeline.output_dir}/cluster_semantic_scatter_k_${pipeline.k_clusters}.png
