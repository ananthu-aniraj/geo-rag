<div style="width:220px; max-height: 380px; overflow-y: auto; color: #f1f5f9;">
    <img src="{image_url}" data-orig-src="{image_url}" onerror="handleImageError(this, '{photo_id}', '{platform}')" width="100%" style="border-radius: 4px; border: 1px solid #334155;">
    <p style="font-size: 11px; margin-top: 6px; line-height: 1.45; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <span style="color: #94a3b8;">ID:</span> <span style="color: #f8fafc; font-weight: 600;">{photo_id}</span><br>
        <span style="color: #94a3b8;">Platform:</span> <span style="color: #f8fafc;">{platform}</span><br>
        {taken_text}
        {season_text}
        {koppen_text}
        {cluster_text}
        <span style="color: #94a3b8;">H3 Cell:</span> <span style="color: #38bdf8; font-family: monospace;">{h3_cell}</span><br>
        <a href="{image_url}" data-orig-href="{image_url}" target="_blank" style="color: #38bdf8; text-decoration: none; font-weight: 600; display: inline-block; margin-top: 4px;">Full Image ↗</a>
    </p>
</div>
