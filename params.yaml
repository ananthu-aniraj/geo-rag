# params.yaml
pipeline:
  k_clusters: 40000
  auto_find_k: true  # Mathematically estimate and update k before clustering
  k_min: 30000       # Minimum cluster count for validation search range
  k_max: 60000       # Maximum cluster count for validation search range
  k_step: 10000      # Step size for validation search range
  cleanup_anomalies: false  # Safely purge locked-latitude GPS coordinates before clustering
  max_markers: 10000
  limit_cells: 0
  checkpoint_interval: 180000
  batch_size: 64
  cell_chunk_size: 32
  base_name: "geo_space"
  # Target output folder on the external HDD
  output_dir: "/home/ananthu/DATA/data_ananthu/full_pipeline_output"
  # New MLLM clustering settings
  label_method: "mllm"
  mllm_backend: "sglang"
  mllm_model: "google/gemma-4-E4B-it"
  chunk_size: 64
  # Input directories passed as a space-separated string
  input_dirs: "/home/ananthu/DATA/data_ananthu/flickr_scrape_rand_4 /home/ananthu/DATA/data_ananthu/mapillary_scrape_rand_4 /home/ananthu/DATA/data_ananthu/mapillary_africa"
  
  # Zero-shot filters for iNaturalist data (true/false)
  filter_macro: true
  filter_sky: true
  
  # Optional local iWildCam dataset path
  iwildcam_dir: "/home/ananthu/DATA/data_ananthu/iwildcam_subset"
