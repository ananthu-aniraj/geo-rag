# params.yaml
pipeline:
  k_clusters: 40000
  representation_type: "cls"   # Representation embedding variant (options: "cls", "avg_patch", "cls_avg_patch")
  precision: "float16"         # Stored binary precision (options: "float32", "float16")
  auto_find_k: true  # Mathematically estimate and update k before clustering
  k_min: 20000       # Minimum cluster count for validation search range
  k_max: 80000       # Maximum cluster count for validation search range
  k_step: 10000      # Step size for validation search range
  cleanup_anomalies: true  # Safely purge locked-latitude GPS coordinates before clustering
  cleanup_platform: "mapillary"     # (Optional) Restrict anomaly cleanup to a specific platform (e.g., "mapillary")
  cleanup_continent: ""    # (Optional) Restrict anomaly cleanup to a specific continent (e.g., "africa")
  max_markers: 10000
  limit_cells: 0
  checkpoint_interval: 30000
  batch_size: 128
  cell_chunk_size: 64
  base_name: "geo_space"
  # Target output folder on the external HDD
  output_dir: "/path/to/full_pipeline_output"
  # New MLLM clustering settings
  label_method: "mllm"
  mllm_backend: "sglang"
  mllm_model: "google/gemma-4-E4B-it"
  chunk_size: 64
  num_medoids: 4             # Number of representative medoids to stack for collage auto-labeling (1 to disable / use single-medoid)
  # Input directories passed as a space-separated string
  input_dirs: "/path/to/flickr_scrape /path/to/mapillary_scrape /path/to/osm_scrape"

  # Zero-shot filters for iNaturalist data (true/false)
  filter_macro: true
  filter_sky: true

  # Optional local offline dataset directories (space-separated paths)
  offline_dataset_dirs: "/path/to/offline_dataset_1 /path/to/offline_dataset_2 /path/to/offline_dataset_3"

  # Köppen-Geiger climate classification GeoTIFF path
  koppen_geiger_tif: "/path/to/koppen_geiger_0p00833333.tif"

  # Land boundaries shapefile for region mapping (country & continent)
  land_shp: "shapefiles/ne_10m_admin_0_countries.shp"

  # Public Hugging Face Datasets packaging options
  relativize_paths: true
  relativize_mappings:
    - "/path/to/offline_dataset_1:offline_dataset_1"
    - "/path/to/offline_dataset_2:offline_dataset_2"
    - "/path/to/offline_dataset_3:offline_dataset_3"
