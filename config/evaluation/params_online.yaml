# Online Spatial Evaluation Configuration Parameters (Environmental Zones & EUNIS)

environmental_zones:
  model_name: "google/tipsv2-b14"
  csv_path: "/path/to/your/geo_space_deduplicated.parquet"
  countries_shp: "shapefiles/ne_10m_admin_0_countries.shp"
  raster: "/path/to/your/eea_r_3035_100_m_EnvZ-Metzger_2025_v1_r00.tif"
  num_queries: 5000
  num_database: 400000
  batch_size: 32
  seed: 42
  query_platform: "flickr"
  visualize_samples: 100
  offline_dataset_dirs: "/path/to/your/offline_dataset_1 /path/to/your/offline_dataset_2"
  use_segformer: false
  use_fg_removal: true
  fg_attn_threshold: 1.5     # Multiplier over uniform attention (1/N) (e.g. 1.3 - 2.0)
  max_fg_ratio: 0.25         # Max fraction of patches allowed as foreground (25%)
  # ADE20K semantic segmentation classes to discard during background masking
  # (2: sky, 12: person, 20: car, 43: sign, 80: bus, 83: truck, 102: van, 127: bike)
  discard_classes: [2, 12, 20, 43, 80, 83, 102, 127]

eunis:
  model_name: "google/tipsv2-b14"
  csv_path: "/path/to/your/geo_space_deduplicated.parquet"
  countries_shp: "shapefiles/ne_10m_admin_0_countries.shp"
  raster: "/path/to/your/eunis_dominant.tif"
  num_queries: 5000
  num_database: 400000
  batch_size: 32
  seed: 42
  query_platform: "flickr"
  visualize_samples: 100
  offline_dataset_dirs: "/path/to/your/offline_dataset_1 /path/to/your/offline_dataset_2"
  use_segformer: false
  use_fg_removal: true
  fg_attn_threshold: 1.5     # Multiplier over uniform attention (1/N) (e.g. 1.3 - 2.0)
  max_fg_ratio: 0.25         # Max fraction of patches allowed as foreground (25%)
  # ADE20K semantic segmentation classes to discard during background masking
  # (2: sky, 12: person, 20: car, 43: sign, 80: bus, 83: truck, 102: van, 127: bike)
  discard_classes: [2, 12, 20, 43, 80, 83, 102, 127]
