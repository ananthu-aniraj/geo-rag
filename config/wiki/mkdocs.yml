site_name: Geo-RAG
theme:
  name: material
  palette:
    primary: teal
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - search.highlight

docs_dir: '../../docs'
site_dir: '../../site'

hooks:
  - hooks.py

extra_javascript:
  - assets/js/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Dataset Guide: dataset.md
  - Pipeline Architecture:
      - Overview: pipeline.md
      - 1. Ingestion & Scraping: pipeline/01_ingestion_scraping.md
      - 2. Spatial Deduplication: pipeline/02_spatial_deduplication.md
      - 3. Timestamp Standardization: pipeline/03_timestamp_standardization.md
      - 4. Coordinate Cleanup: pipeline/04_coordinate_cleanup.md
      - 5. Optimal K Estimation: pipeline/05_optimal_k_estimation.md
      - 6. Clustering & Drift: pipeline/06_clustering_dynamic_drift.md
      - 7. MLLM Labeling: pipeline/07_mllm_labeling.md
      - 8. Spatial-Semantic Indexing: pipeline/08_spatial_semantic_indexing.md
      - 9. Dashboards: pipeline/09_visualization_dashboards.md
  - Evaluation: evaluation.md
  - Benchmark Results:
      - Overview: evaluation_results/index.md
      - EUNIS Comparison: evaluation_results/comparison_eunis.md
      - LUCAS Comparison: evaluation_results/comparison_lucas.md
      - Places Comparison: evaluation_results/comparison_places.md
  - Metrics: metrics.md
  - Changelog: changelog.md
